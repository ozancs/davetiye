<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tamay ve Ozan — Nikah Davetiyesi</title>
<meta property="og:title" content="Tamay ve Ozan — Nikah Davetiyesi">
<meta property="og:description" content="3 Ekim 2026 · 15:45 · Beşiktaş Belediyesi Evlendirme Dairesi">
<meta name="theme-color" content="#55663f">
<style>
  :root{ --paper:#fdfefb; --olive:#55663f; --ease:cubic-bezier(.2,.65,.25,1); --d:1.5s; --f:3.1s; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:linear-gradient(to bottom,#d8e9f0,#e7eee1);
    overflow:hidden; font-family:Georgia,'Times New Roman',serif;
    -webkit-tap-highlight-color:transparent;
  }
  .scene{position:fixed; inset:0; overflow:hidden;}
  .stagecol{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    gap:2vh;
    padding:calc(env(safe-area-inset-top,0px) + 2vh) 0 calc(env(safe-area-inset-bottom,0px) + 2vh);
  }

  /* ---------- kart: orijinal tasarımın şeritleri ---------- */
  .card{
    position:relative;
    width:min(88vw, 52vh);
    aspect-ratio:2481/3497;
    background:var(--paper) url(data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAAwBEwDASIAAhEBAxEB/8QAFwABAQEBAAAAAAAAAAAAAAAAAAECCP/EABsQAQEBAQEBAQEAAAAAAAAAAAABESExQYFh/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAEC/8QAFREBAQAAAAAAAAAAAAAAAAAAABH/2gAMAwEAAhEDEQA/AOyAGQAAAAAAE1QAASoAC+oAKIDQkUAAAABL4UBGtZUFEnhAUAAAEqKgAAC6i8BRIoAAAAAAH0AAAC+MrUAFQFEAXiKAgqAsqsqBpoQFgAAABolBdGQGgAAAIAAAAlVKAWoAAAsVIoFAA4AAAAAAACYKAQSmAaqU0FEtQGhNXQAAAAAAAAAAAAKAABoCeLpoJ51U0BTqKB8DQAAAAAAAAAC+AVNPSgG8QBYUARQBABFQ+qKRUICmiX0F8TRAWiFAEUQWCCtaJFA1KgAAAAAsRoAAAAAAAAAAAogIsQBrGVQF+IqAL+IvgHEVAAKAsxASraqRRQAEooBiVUz+gKYAAAAAAAGACVFqgysUAAAAAAAAAAAAAAAS1QEMUBMRpMBFwxQAAAAAAAAAAAAAAQ4YUEVAFEUFABM6oAAAAAAAAAyLIYCCoCoALDCLoIigIKgKaABDwlBUwN4AgAACGAACoKAAAAAAAAuKQAAAAAAAPgfAIAAy0mAioAv1FiAAAuFJVBleFMAwVLQQFwEaTFAAAAAAAAAAAAAAAAAAAAAAAAAKAAAAfgAAAAAAACdBRCAoAAVICiIDQmgKlJSgoigAAAAAUGQAFMAUSKAJSAoalBRIoP/Z) repeat-y;
    background-size:100% auto;
    box-shadow:0 18px 55px rgba(70,75,55,.28);
    border-radius:6px; overflow:hidden;
    opacity:0;
    transform:scale(1.10) translateY(3vh); filter:blur(14px);
  }
  .run .card{animation:cardIn 2.4s cubic-bezier(.3,.05,.15,1) .2s forwards;}
  @keyframes cardIn{55%{opacity:1;}100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0);}}

  .strip{position:absolute; left:0; width:100%; display:block; opacity:0; transform:translateY(10px);}
  .run .strip{animation:rvIn .9s var(--ease) forwards;}
  .st-names  {top:6.577%;}
  .st-invite {top:16.300%;}
  .st-date   {top:25.879%;}
  .st-addr   {top:33.743%;}
  .st-parents{top:44.610%;}
  .st-art    {top:54.189%; transform:translateY(22px);}
  .run .st-names  {animation-delay:var(--d);}
  .run .st-invite {animation-delay:calc(var(--d) + .16s);}
  .run .st-date   {animation-delay:calc(var(--d) + .32s);}
  .run .st-addr   {animation-delay:calc(var(--d) + .48s);}
  .run .st-parents{animation-delay:calc(var(--d) + .64s);}
  .run .st-art    {animation:rvIn 1.2s var(--ease) calc(var(--d) + .8s) forwards;}
  @keyframes rvIn{to{opacity:1; transform:translateY(0);}}

  /* ---------- footer: glass sayaç + takvim ---------- */
  .footer{
    display:flex; flex-direction:column; align-items:center; gap:1.4vh;
    opacity:0; transform:translateY(16px);
    width:min(88vw, 52vh);
    z-index:20;
  }
  .run .footer{animation:rvIn 1.1s var(--ease) var(--f) forwards;}
  .count{display:flex; gap:8px; justify-content:center; width:100%;}
  .cell{
    flex:1; max-width:86px;
    background:rgba(255,255,255,.42);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);
    backdrop-filter:blur(14px) saturate(1.3);
    border:1px solid rgba(255,255,255,.65);
    box-shadow:0 8px 24px rgba(90,100,70,.14), inset 0 1px 0 rgba(255,255,255,.7);
    border-radius:16px; padding:10px 4px 8px; text-align:center;
  }
  .cell b{display:block; color:var(--olive); font-size:clamp(20px,6vw,30px); font-weight:600; line-height:1; font-variant-numeric:tabular-nums;}
  .cell span{display:block; margin-top:4px; color:#6b7460; font-size:clamp(9px,2.6vw,12px); font-variant:small-caps; letter-spacing:.18em;}
  .addcal{
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.42);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);
    backdrop-filter:blur(14px) saturate(1.3);
    border:1px solid rgba(255,255,255,.65);
    box-shadow:0 8px 24px rgba(90,100,70,.14), inset 0 1px 0 rgba(255,255,255,.7);
    border-radius:999px; color:#41503a; font-family:inherit;
    font-variant:small-caps; letter-spacing:.14em;
    font-size:clamp(13px,3.6vw,16px);
    padding:10px 22px; cursor:pointer; text-decoration:none;
    transition:transform .2s ease;
  }
  .addcal:active{transform:scale(.97);}
  .addcal svg{width:17px; height:17px; stroke:#55663f;}

  /* ---------- bulutlar ---------- */
  .clouds{position:absolute; inset:0; pointer-events:none; z-index:10;}
  .layer{position:absolute; left:-12%; width:124%; top:0; height:100%;}
  .puff{position:absolute;}
  .puff svg{display:block; width:100%; height:auto;}
  .run .lz1{animation:pass 2.2s cubic-bezier(.45,.02,.2,1) forwards;}
  .run .lz2{animation:pass 2.7s cubic-bezier(.45,.02,.2,1) .1s forwards;}
  .run .lz3{animation:pass 3.2s cubic-bezier(.45,.02,.2,1) .2s forwards;}
  @keyframes pass{to{transform:translateY(-220vh);}}
  .run .lz1 .puff{animation:swell 2.2s ease forwards;}
  @keyframes swell{to{scale:1.3;}}
  .veil{position:absolute; inset:0; background:#e8f1f3; pointer-events:none; z-index:11;}
  .run .veil{animation:veilOut 1.2s ease .1s forwards;}
  @keyframes veilOut{to{opacity:0;}}

  /* ---------- yaprak yağmuru: EN ÖNDE, tüm sayfa ---------- */
  .petals{position:absolute; inset:0; pointer-events:none; z-index:40; overflow:hidden;}
  .petals i{
    position:absolute; top:-7vh; left:calc(var(--x) * 1vw);
    width:var(--sz); height:calc(var(--sz) * 1.35);
    background:radial-gradient(ellipse at 30% 28%, var(--c1), var(--c2));
    border-radius:78% 12% 78% 12%;
    opacity:0;
    filter:blur(var(--bl,0px));
  }
  .run .petals i{animation:leaf var(--dur) linear var(--dl) infinite;}
  @keyframes leaf{
    0%{transform:translateY(-8vh) translateX(0) rotate(0deg); opacity:0;}
    6%{opacity:var(--op,.92);}
    30%{transform:translateY(28vh) translateX(2.6vw) rotate(calc(var(--rot) * .7deg));}
    60%{transform:translateY(62vh) translateX(-2vw) rotate(calc(var(--rot) * 1.5deg));}
    100%{transform:translateY(114vh) translateX(1.8vw) rotate(calc(var(--rot) * 2.3deg)); opacity:var(--op,.92);}
  }

  .music{
    position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); left:14px;
    width:38px; height:38px; padding:8px;
    border:1px solid #b9c0ae; background:rgba(255,255,255,.7);
    border-radius:50%; cursor:pointer; z-index:90; opacity:.85;
  }
  .music svg{width:100%; height:100%;}
  .replay{
    position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); right:14px;
    border:1px solid #b9c0ae; background:rgba(255,255,255,.7); color:#5c6a4e;
    font-family:inherit; font-variant:small-caps; letter-spacing:.12em; font-size:13px;
    padding:5px 14px; border-radius:999px; cursor:pointer; z-index:90; opacity:.85;
  }

  @media (prefers-reduced-motion: reduce){
    .card,.strip,.footer{opacity:1 !important; transform:none !important; filter:none !important; animation:none !important;}
    .clouds,.veil,.petals{display:none !important;}
  }
</style>
</head>

<script>
/* ---------- tatlı bulutlar ---------- */
function cloudSVG(seed, tint){
  const id = 'cf' + seed;
  return `<svg viewBox="0 0 400 190" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="${id}" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.035" numOctaves="3" seed="${seed}"/>
      <feDisplacementMap in="SourceGraphic" scale="16"/>
      <feGaussianBlur stdDeviation="1.2"/></filter></defs>
    <g filter="url(#${id})">
      <ellipse cx="200" cy="128" rx="180" ry="42" fill="${tint}"/>
      <circle cx="120" cy="105" r="52" fill="${tint}"/>
      <circle cx="190" cy="82" r="62" fill="#ffffff"/>
      <circle cx="265" cy="100" r="50" fill="#ffffff"/>
      <circle cx="320" cy="125" r="38" fill="${tint}"/>
      <circle cx="82" cy="132" r="36" fill="#eef5fb"/>
      <ellipse cx="200" cy="150" rx="165" ry="26" fill="#c9dded" opacity=".6"/>
    </g></svg>`;
}
const tints = ['#e6f1fb','#f0f7fd','#ddecf9'];
const layout = {
  lz1:[['-10vw','-4vh','105vw'],['-8vw','44vh','100vw',1],['-8vw','102vh','120vw']],
  lz2:[['-14vw','4vh','95vw',1],['-12vw','62vh','112vw'],['-10vw','126vh','106vw',1],['-6vw','176vh','110vw']],
  lz3:[['-6vw','24vh','115vw'],['-4vw','82vh','104vw',1],['-4vw','150vh','124vw']]
};
let ci = 0;
for(const [lz, items] of Object.entries(layout)){
  const layer = document.querySelector('.'+lz);
  items.forEach(([x,y,w,right])=>{
    const d = document.createElement('div');
    d.className = 'puff';
    d.style.cssText = `width:min(${w},760px); top:${y}; ${right?'right':'left'}:${x};`;
    d.innerHTML = cloudSVG(5+ci*7, tints[ci%3]); ci++;
    layer.appendChild(d);
  });
}

/* ---------- sık yaprak yağmuru ---------- */
const petalsEl = document.getElementById('petals');
const rnd = (a,b)=>a+Math.random()*(b-a);
const cols = [['#cfe0a8','#94ad70'],['#d8e6b2','#a2b87c'],['#c2d698','#86a061'],['#dcebc0','#9db474']];
let phtml = '';
for(let i=0;i<34;i++){
  const far = Math.random() < .38;              // arka plan yaprakları: küçük, flu, soluk
  const sz  = far ? rnd(7,10) : rnd(11,19);
  const c   = cols[i%4];
  phtml += `<i style="--x:${rnd(1,97).toFixed(1)};--dl:${rnd(0,6.5).toFixed(2)}s;--dur:${rnd(5.5,10).toFixed(2)}s;--sz:${sz.toFixed(1)}px;--rot:${(Math.random()<.5?-1:1)*rnd(35,95)|0};--c1:${c[0]};--c2:${c[1]};--bl:${far?'1.2px':'0px'};--op:${far?.55:.92}"></i>`;
}
petalsEl.innerHTML = phtml;

/* ---------- akış ---------- */
const scene = document.getElementById('scene');
function restart(){
  scene.classList.remove('run');
  void scene.offsetWidth;
  scene.classList.add('run');
}
document.getElementById('replay').addEventListener('click', restart);
restart();

/* ---------- geri sayım ---------- */
const target = Date.UTC(2026, 9, 3, 12, 45, 0);
const $ = id => document.getElementById(id);
function tick(){
  let ms = target - Date.now(); if(ms<0) ms=0;
  const s = Math.floor(ms/1000);
  $('cd').textContent = Math.floor(s/86400);
  $('ch').textContent = String(Math.floor(s%86400/3600)).padStart(2,'0');
  $('cm').textContent = String(Math.floor(s%3600/60)).padStart(2,'0');
  $('cs').textContent = String(s%60).padStart(2,'0');
}
tick(); setInterval(tick, 1000);

/* ---------- yumuşak fon müziği (Web Audio, telifsiz) ---------- */
let AC=null, master=null, musicOn=false, schedTimer=null, step=0;
const mBtn=document.getElementById('music'), icOn=document.getElementById('mIcOn'), icOff=document.getElementById('mIcOff');

function audioInit(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0;
  const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600;
  const dly = AC.createDelay(1.2); dly.delayTime.value=.42;
  const fb  = AC.createGain(); fb.gain.value=.32;
  const wet = AC.createGain(); wet.gain.value=.28;
  master.connect(lp); lp.connect(AC.destination);
  lp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(AC.destination);
}
function pluck(freq, t, dur, vol){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.value=freq;
  const o2=AC.createOscillator(), g2=AC.createGain();
  o2.type='triangle'; o2.frequency.value=freq*2; g2.gain.value=.16;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.03);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  o.start(t); o2.start(t); o.stop(t+dur+.1); o2.stop(t+dur+.1);
}
function pad(freqs, t, dur){
  freqs.forEach(f=>{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.05,t+dur*.35);
    g.gain.linearRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+dur+.1);
  });
}
/* Fa majör pentatonik etrafında sakin bir döngü */
const SC=[349.23,392.00,440.00,523.25,587.33,698.46];   /* F G A C D F */
const CH=[[174.61,261.63,349.23],[196.00,293.66,392.00],[220.00,329.63,440.00],[174.61,261.63,349.23]];
function schedule(){
  if(!musicOn) return;
  const t=AC.currentTime+.05, beat=.62;
  if(step%8===0) pad(CH[(step/8)%4], t, beat*8.4);
  const n=SC[[0,2,4,3,5,4,2,1][step%8]];
  if(step%2===0 || Math.random()<.4) pluck(n*(Math.random()<.18?2:1), t, 2.2, .10);
  step++;
  schedTimer=setTimeout(schedule, beat*1000);
}
function setMusic(on){
  audioInit();
  if(AC.state==='suspended') AC.resume();
  musicOn=on;
  icOn.style.display = on?'block':'none';
  icOff.style.display = on?'none':'block';
  const now=AC.currentTime;
  master.gain.cancelScheduledValues(now);
  master.gain.linearRampToValueAtTime(on?1:0, now+1.2);
  if(on && !schedTimer){ schedule(); }
  if(!on && schedTimer){ clearTimeout(schedTimer); schedTimer=null; }
}
mBtn.addEventListener('click', ()=>setMusic(!musicOn));
/* tarayıcılar sesli otomatik oynatmayı engeller: ilk dokunuşta nazikçe başlat */
function firstTouch(){ setMusic(true); document.removeEventListener('pointerdown', firstTouch); }
document.addEventListener('pointerdown', firstTouch);
</script>
